# =====================================================================
#  Sunrise Dental Clinic - TIER 2 configuration
# =====================================================================

server.port=8080
spring.application.name=sunrise-clinic-service

# ---- TIER 3 connection ---------------------------------------------
# Change the password to your own MySQL root password.
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_clinic?serverTimezone=Asia/Colombo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail fast at start-up if the database is unreachable, rather than on
# the first request.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000

# Readable JSON while developing
spring.jackson.serialization.indent-output=true
