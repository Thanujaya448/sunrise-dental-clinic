# =====================================================================
#  Sunrise Dental Clinic - TIER 2 configuration
# =====================================================================

server.port=8080
spring.application.name=sunrise-clinic-service

# ---- TIER 3 connection ---------------------------------------------
# Change the password to your own MySQL root password.
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_clinic?serverTimezone=Asia/Colombo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail fast at start-up if the database is unreachable, rather than on
# the first request.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000

# Readable JSON while developing
spring.jackson.serialization.indent-output=true

# ---- FR-20 appointment confirmation emails ---------------------------
# Sending is OFF by default so the system runs, and the tests pass, with no
# mail account configured. Turn it on and supply credentials at RUNTIME:
#
#   java -jar clinic-service.jar ^
#        --clinic.notifications.email.enabled=true ^
#        --spring.mail.username=you@gmail.com ^
#        --spring.mail.password=<16-character Google app password>
#
# Credentials are never committed. A password in a public repository cannot
# be un-committed from the history.
clinic.name=Sunrise Dental Clinic
clinic.notifications.email.enabled=false
clinic.notifications.email.from=noreply@sunrisedental.lk

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
